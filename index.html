<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Select — Random Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1923;
    --panel:#1B2530;
    --panel-alt:#212D3A;
    --line:#2E3944;
    --red:#FF4655;
    --cyan:#3ED6E0;
    --violet:#B983FF;
    --mint:#5FE0A6;
    --gold:#FFCB57;
    --cream:#ECE8E1;
    --steel:#8A9199;
    --cut:16px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    background-color:var(--bg);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(45deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:42px 42px;
    font-family:'Rajdhani',sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    padding:2.2rem 1rem 3rem;
  }
  body::before,body::after{
    content:'';position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;
  }
  body::before{top:-12%;left:-12%;width:55vw;height:55vw;background:radial-gradient(circle, rgba(255,70,85,.28), transparent 70%);}
  body::after{bottom:-16%;right:-12%;width:52vw;height:52vw;background:radial-gradient(circle, rgba(62,214,224,.24), transparent 70%);}

  .wrap{width:100%;max-width:560px;position:relative;z-index:1;}

  .panel-cut{
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  }

  .topbar{
    position:relative;
    background:var(--panel);
    padding:1rem 1.4rem 1rem 1.7rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
    margin-bottom:1.6rem;
  }
  .topbar::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--red),var(--cyan),var(--violet),var(--gold));
  }
  .brand-group{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;}
  .brand{
    font-family:'Teko',sans-serif;
    font-size:clamp(1.6rem,5vw,2.1rem);
    font-weight:700;
    letter-spacing:.06em;
    color:var(--cream);
  }
  .brand-sub{font-size:.85rem;letter-spacing:.03em;color:var(--steel);}

  .ghost-btn{
    background:transparent;border:1px solid var(--line);color:var(--steel);
    font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:600;padding:.4em 1em;cursor:pointer;
    transition:border-color .18s,color .18s;white-space:nowrap;
  }
  .ghost-btn:hover{border-color:var(--gold);color:var(--cream);}

  .players{display:flex;justify-content:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap;}
  .tab{
    background:transparent;border:1px solid var(--line);color:var(--steel);
    font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:600;
    padding:.5em 1.5em;cursor:pointer;transition:background .18s,color .18s,border-color .18s,transform .12s;
  }
  .tab:hover:not(.active){transform:translateY(-1px);}
  .tab[data-player="Noman"]:hover:not(.active){border-color:var(--red);color:var(--cream);}
  .tab[data-player="Fahim"]:hover:not(.active){border-color:var(--cyan);color:var(--cream);}
  .tab[data-player="Mushiur"]:hover:not(.active){border-color:var(--violet);color:var(--cream);}
  .tab[data-player="Noman"].active{background:var(--red);border-color:var(--red);color:var(--bg);}
  .tab[data-player="Fahim"].active{background:var(--cyan);border-color:var(--cyan);color:var(--bg);}
  .tab[data-player="Mushiur"].active{background:var(--violet);border-color:var(--violet);color:var(--bg);}
  .tab:focus-visible, button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .spin-for{text-align:center;font-size:.95rem;color:var(--steel);margin:0 0 1.6rem;}
  .spin-for strong{font-weight:700;transition:color .2s;}

  .wheel-stage{position:relative;width:min(88vw,480px);aspect-ratio:1/1;margin:0 auto 1.8rem;}
  .wheel-stage::after{
    content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.9), transparent 60%);opacity:0;
  }
  .wheel-stage.lock::after{animation:flashPop .5s ease-out;}
  @keyframes flashPop{0%{opacity:.85;}100%{opacity:0;}}

  .pointer{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:20px solid var(--gold);
    filter:drop-shadow(0 0 6px rgba(255,203,87,.6));z-index:5;
  }
  .wheel-canvas{
    width:100%;height:100%;border-radius:50%;display:block;
    transition:transform 10s cubic-bezier(.22,1,.36,1);
    transform-origin:50% 50%;will-change:transform;
  }
  .spin-hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:23%;height:23%;min-width:64px;min-height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2A1620, var(--bg) 72%);
    border:3px solid var(--gold);color:var(--cream);
    font-family:'Teko',sans-serif;font-size:clamp(1rem,3vw,1.4rem);font-weight:700;letter-spacing:.08em;
    cursor:pointer;z-index:6;transition:transform .15s, opacity .2s;
    animation:idleGlow 4s ease-in-out infinite;
  }
  @keyframes idleGlow{
    0%,100%{box-shadow:0 0 22px rgba(255,70,85,.45);}
    25%{box-shadow:0 0 22px rgba(62,214,224,.45);}
    50%{box-shadow:0 0 22px rgba(185,131,255,.45);}
    75%{box-shadow:0 0 22px rgba(255,203,87,.5);}
  }
  .spin-hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.96);}
  .spin-hub:disabled{opacity:.5;cursor:not-allowed;animation:none;box-shadow:none;}

  .confetti-piece{
    position:absolute;width:8px;height:8px;border-radius:2px;
    transform:translate(-50%,-50%);animation:confettiFly .9s ease-out forwards;
    pointer-events:none;z-index:8;
  }
  @keyframes confettiFly{
    0%{transform:translate(-50%,-50%) translate(0,0) rotate(0deg);opacity:1;}
    100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}
  }

  .result-card{
    display:flex;align-items:center;gap:1.1rem;max-width:520px;margin:0 auto 1.2rem;
    padding:1rem 1.3rem;background:var(--panel);border-left:4px solid var(--gold);
    transition:border-color .25s;
  }
  .result-icon{
    flex-shrink:0;width:60px;height:60px;border-radius:50%;background:var(--panel-alt);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:'Teko',sans-serif;font-size:1.6rem;font-weight:700;color:var(--steel);
  }
  .result-icon img{width:100%;height:100%;object-fit:cover;}
  .result-eyebrow{margin:0 0 .1rem;font-size:.82rem;color:var(--steel);}
  .result-agent{margin:0;font-family:'Teko',sans-serif;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;letter-spacing:.02em;line-height:1.05;}
  .result-role{margin:.15rem 0 0;font-size:.85rem;color:var(--steel);}

  @keyframes popIn{
    0%{transform:scale(.35) rotate(-10deg);opacity:0;}
    60%{transform:scale(1.1) rotate(3deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes cardGlow{
    0%{box-shadow:0 0 0 rgba(255,203,87,0);}
    30%{box-shadow:0 0 40px rgba(255,203,87,.5);}
    100%{box-shadow:0 0 0 rgba(255,203,87,0);}
  }
  .result-card.reveal{animation:cardGlow 900ms ease-out;}
  .result-card.reveal .result-icon{animation:popIn .6s cubic-bezier(.34,1.56,.64,1);}

  .history-panel{max-width:520px;margin:0 auto 1rem;background:var(--panel);padding:1rem 1.2rem;}
  .history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;}
  .history-head h3{margin:0;font-family:'Teko',sans-serif;font-size:1.3rem;font-weight:600;letter-spacing:.03em;}

  .history-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem;max-height:220px;overflow-y:auto;}
  .history-list li{
    display:flex;justify-content:space-between;gap:.8rem;font-size:.9rem;padding:.45em .7em;
    background:var(--panel-alt);border-left:2px solid var(--line);
  }
  .h-player{color:var(--cream);font-weight:600;white-space:nowrap;}
  .h-agent{color:var(--steel);text-align:right;}
  .history-empty{justify-content:center;color:var(--steel);background:transparent;border:none;padding:.6rem;}

  .status-line{text-align:center;font-size:.8rem;color:var(--steel);margin-top:.2rem;}

  @media (prefers-reduced-motion: reduce){
    .wheel-canvas{transition-duration:.6s;}
    .result-card.reveal,.result-card.reveal .result-icon,.spin-hub{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar panel-cut">
    <div class="brand-group">
      <span class="brand">VALORANT</span>
      <span class="brand-sub">Agent Select Wheel</span>
    </div>
    <button id="soundToggle" class="ghost-btn" type="button" aria-pressed="true">Sound: On</button>
  </header>

  <section class="players" role="tablist" aria-label="Choose player">
    <button class="tab active" data-player="Noman" role="tab" aria-selected="true">Noman</button>
    <button class="tab" data-player="Fahim" role="tab" aria-selected="false">Fahim</button>
    <button class="tab" data-player="Mushiur" role="tab" aria-selected="false">Mushiur</button>
  </section>

  <p class="spin-for">Spinning for <strong id="currentPlayerLabel">Noman</strong></p>

  <div class="wheel-stage" id="wheelStage">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheelCanvas" class="wheel-canvas" width="480" height="480"></canvas>
    <button id="spinBtn" class="spin-hub" disabled>
      <span id="spinBtnLabel">LOADING</span>
    </button>
  </div>

  <div id="resultCard" class="result-card panel-cut" aria-live="polite">
    <div class="result-icon" id="resultIcon">—</div>
    <div class="result-text">
      <p class="result-eyebrow" id="resultEyebrow">Awaiting spin</p>
      <h2 class="result-agent" id="resultAgentName">—</h2>
      <p class="result-role" id="resultRole">&nbsp;</p>
    </div>
  </div>

  <section class="history-panel panel-cut">
    <div class="history-head">
      <h3>Match History</h3>
      <button id="clearHistoryBtn" class="ghost-btn" type="button">Clear</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-empty">No spins yet this session.</li>
    </ul>
  </section>

  <p class="status-line" id="statusLine">Loading agent roster…</p>
</div>

<script>
(function(){
  const FALLBACK_AGENTS = [
    {name:'Brimstone',role:'Controller'},{name:'Viper',role:'Controller'},
    {name:'Omen',role:'Controller'},{name:'Astra',role:'Controller'},
    {name:'Harbor',role:'Controller'},{name:'Clove',role:'Controller'},
    {name:'Sova',role:'Initiator'},{name:'Breach',role:'Initiator'},
    {name:'Skye',role:'Initiator'},{name:'KAY/O',role:'Initiator'},
    {name:'Fade',role:'Initiator'},{name:'Gekko',role:'Initiator'},
    {name:'Tejo',role:'Initiator'},
    {name:'Sage',role:'Sentinel'},{name:'Cypher',role:'Sentinel'},
    {name:'Killjoy',role:'Sentinel'},{name:'Chamber',role:'Sentinel'},
    {name:'Deadlock',role:'Sentinel'},{name:'Vyse',role:'Sentinel'},
    {name:'Phoenix',role:'Duelist'},{name:'Jett',role:'Duelist'},
    {name:'Reyna',role:'Duelist'},{name:'Raze',role:'Duelist'},
    {name:'Yoru',role:'Duelist'},{name:'Neon',role:'Duelist'},
    {name:'Iso',role:'Duelist'},{name:'Waylay',role:'Duelist'}
  ];

  const ROLE_COLORS = {
    'Duelist':{base:'#FF4655',alt:'#E23A48'},
    'Initiator':{base:'#3ED6E0',alt:'#2FB9C2'},
    'Controller':{base:'#B983FF',alt:'#9D68E6'},
    'Sentinel':{base:'#5FE0A6',alt:'#46C48F'},
    '':{base:'#FFCB57',alt:'#E6B347'}
  };
  function roleColor(role){ return ROLE_COLORS[role] || ROLE_COLORS['']; }

  const PLAYER_ACCENT = {Noman:'#FF4655', Fahim:'#3ED6E0', Mushiur:'#B983FF'};

  const SPIN_MS = 10000;

  const players = ['Noman','Fahim','Mushiur'];
  let currentPlayer = players[0];
  let agents = [];
  let iconImages = [];
  let cumulativeRotation = 0;
  let spinning = false;
  let history = [];
  let soundOn = true;
  let audioCtx = null;

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const wheelStage = document.getElementById('wheelStage');
  const spinBtn = document.getElementById('spinBtn');
  const spinBtnLabel = document.getElementById('spinBtnLabel');
  const statusLine = document.getElementById('statusLine');
  const currentPlayerLabel = document.getElementById('currentPlayerLabel');
  const resultCard = document.getElementById('resultCard');
  const resultIcon = document.getElementById('resultIcon');
  const resultEyebrow = document.getElementById('resultEyebrow');
  const resultAgentName = document.getElementById('resultAgentName');
  const resultRole = document.getElementById('resultRole');
  const historyList = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const soundToggle = document.getElementById('soundToggle');

  currentPlayerLabel.style.color = PLAYER_ACCENT[currentPlayer];

  // ---------- sound ----------
  function ensureAudio(){
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, duration, type, gainStart, delay){
    if(!soundOn) return;
    const c = ensureAudio();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const t0 = c.currentTime + (delay||0);
    gain.gain.setValueAtTime(gainStart||0.15, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+duration+0.03);
  }
  function playClick(){ tone(320,.05,'square',.12,0); }
  function playTick(freq){ tone(freq,.045,'square',.11,0); }
  function playReveal(){
    tone(587.33,.16,'sine',.16,0);
    tone(739.99,.16,'sine',.16,.12);
    tone(880.00,.30,'sine',.18,.24);
  }
  // Solves the *actual* cubic-bezier used by the CSS transition
  // (cubic-bezier(.22,1,.36,1)) for the time-fraction at which a given
  // rotation-progress is reached. Earlier versions assumed a plain
  // quintic ease-out, which doesn't flatten out early the way this real
  // curve does — so ticks kept firing after the wheel had visually
  // already stopped. Solving the real curve fixes that: ticks only ever
  // land where the wheel is still actually turning.
  const BEZ_P1X=0.22, BEZ_P1Y=1, BEZ_P2X=0.36, BEZ_P2Y=1;
  const BEZ_CX=3*BEZ_P1X, BEZ_BX=3*(BEZ_P2X-BEZ_P1X)-BEZ_CX, BEZ_AX=1-BEZ_CX-BEZ_BX;
  const BEZ_CY=3*BEZ_P1Y, BEZ_BY=3*(BEZ_P2Y-BEZ_P1Y)-BEZ_CY, BEZ_AY=1-BEZ_CY-BEZ_BY;
  function bezSampleX(t){ return ((BEZ_AX*t+BEZ_BX)*t+BEZ_CX)*t; }
  function bezSampleY(t){ return ((BEZ_AY*t+BEZ_BY)*t+BEZ_CY)*t; }
  function bezierTimeFractionForProgress(progress){
    let lo=0, hi=1, t=progress;
    for(let i=0;i<24;i++){
      t=(lo+hi)/2;
      if(bezSampleY(t) < progress) lo=t; else hi=t;
    }
    return bezSampleX(t);
  }

  function scheduleTicks(duration, segmentsCrossed){
    const ticks = Math.min(70, Math.max(24, Math.round(segmentsCrossed)));
    for(let k=1;k<=ticks;k++){
      const progress = k/ticks;
      const t = bezierTimeFractionForProgress(progress) * duration;
      const freq = 700 + (Math.random()*70 - 35);
      setTimeout(()=>playTick(freq), t);
    }
  }

  soundToggle.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggle.textContent = 'Sound: ' + (soundOn?'On':'Off');
    soundToggle.setAttribute('aria-pressed', String(soundOn));
    if(soundOn) ensureAudio();
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      ensureAudio(); playClick();
      document.querySelectorAll('.tab').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
      btn.classList.add('active');
      btn.setAttribute('aria-selected','true');
      currentPlayer = btn.dataset.player;
      currentPlayerLabel.textContent = currentPlayer;
      currentPlayerLabel.style.color = PLAYER_ACCENT[currentPlayer];
    });
  });

  clearHistoryBtn.addEventListener('click', ()=>{ history = []; renderHistory(); });

  // ---------- wheel drawing ----------
  function setCanvasSize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const size = rect.width || 480;
    canvas.width = size*dpr;
    canvas.height = size*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawWheel();
  }

  function drawWheel(){
    if(!agents.length) return;
    const rect = canvas.getBoundingClientRect();
    const size = rect.width || 480;
    const R = size/2;
    ctx.clearRect(0,0,size,size);
    const segAngle = (Math.PI*2)/agents.length;

    agents.forEach((agent,i)=>{
      const start = -Math.PI/2 + i*segAngle;
      const end = start+segAngle;
      const rc = roleColor(agent.role);
      ctx.beginPath();
      ctx.moveTo(R,R);
      ctx.arc(R,R,R-3,start,end);
      ctx.closePath();
      ctx.fillStyle = i%2===0 ? rc.base : rc.alt;
      ctx.fill();
      ctx.strokeStyle = 'rgba(15,25,35,0.55)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      const mid = start + segAngle/2;
      const iconR = R*0.68;
      const ix = R + Math.cos(mid)*iconR;
      const iy = R + Math.sin(mid)*iconR;
      const bubble = Math.max(18, R*0.115);

      ctx.beginPath();
      ctx.arc(ix,iy,bubble*0.6,0,Math.PI*2);
      ctx.fillStyle = 'rgba(15,25,35,0.78)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(236,232,225,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();

      const img = iconImages[i];
      if(img && img.complete && img.naturalWidth>0){
        ctx.save();
        ctx.beginPath();
        ctx.arc(ix,iy,bubble*0.5,0,Math.PI*2);
        ctx.clip();
        ctx.drawImage(img, ix-bubble*0.5, iy-bubble*0.5, bubble, bubble);
        ctx.restore();
      } else {
        ctx.fillStyle = '#ECE8E1';
        ctx.font = `600 ${Math.round(bubble*0.5)}px Rajdhani, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(agent.name.charAt(0), ix, iy);
      }
    });

    ctx.beginPath();
    ctx.arc(R,R,R-2,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(236,232,225,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function loadIcon(url){
    return new Promise(resolve=>{
      if(!url){resolve(null);return;}
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = ()=>resolve(img);
      img.onerror = ()=>resolve(null);
      img.src = url;
    });
  }

  async function init(){
    try{
      const res = await fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true&language=en-US');
      if(!res.ok) throw new Error('bad status');
      const json = await res.json();
      let list = (json.data||[])
        .filter(a=>a.displayName && a.displayName.trim().length>0)
        .map(a=>({
          name:a.displayName.trim(),
          role:(a.role && a.role.displayName) ? a.role.displayName : '',
          icon:a.displayIcon || null
        }));
      const seen = new Set();
      list = list.filter(a=>{ if(seen.has(a.name)) return false; seen.add(a.name); return true; });
      if(list.length < 10) throw new Error('roster too small');
      agents = list;
      statusLine.textContent = agents.length + ' agents loaded from the live roster';
    }catch(err){
      agents = FALLBACK_AGENTS.map(a=>({...a, icon:null}));
      statusLine.textContent = 'Live roster unavailable — using the built-in agent list';
    }

    iconImages = await Promise.all(agents.map(a=>loadIcon(a.icon)));
    setCanvasSize();
    spinBtn.disabled = false;
    spinBtnLabel.textContent = 'SPIN';
  }

  function renderHistory(){
    historyList.innerHTML = '';
    if(history.length===0){
      const li = document.createElement('li');
      li.className = 'history-empty';
      li.textContent = 'No spins yet this session.';
      historyList.appendChild(li);
      return;
    }
    history.slice().reverse().forEach(entry=>{
      const li = document.createElement('li');
      const left = document.createElement('span');
      left.className = 'h-player';
      left.textContent = entry.player;
      const right = document.createElement('span');
      right.className = 'h-agent';
      right.textContent = entry.role ? (entry.agent + ' · ' + entry.role) : entry.agent;
      li.appendChild(left); li.appendChild(right);
      historyList.appendChild(li);
    });
  }

  function burstConfetti(colors){
    const rect = wheelStage.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    const count = 26;
    for(let i=0;i<count;i++){
      const p = document.createElement('span');
      p.className = 'confetti-piece';
      const angle = Math.random()*Math.PI*2;
      const dist = 60+Math.random()*100;
      p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
      p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
      p.style.setProperty('--rot', (Math.random()*360)+'deg');
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.left = cx+'px';
      p.style.top = cy+'px';
      wheelStage.appendChild(p);
      p.addEventListener('animationend', ()=>p.remove());
    }
  }

  function spinWheel(){
    if(spinning || agents.length===0) return;
    ensureAudio();
    spinning = true;
    spinBtn.disabled = true;
    spinBtnLabel.textContent = '...';
    resultCard.classList.remove('reveal');
    playClick();

    const idx = Math.floor(Math.random()*agents.length);
    const segAngle = 360/agents.length;
    const targetMid = idx*segAngle + segAngle/2;
    const requiredMod = (360 - targetMid) % 360;
    const currentMod = ((cumulativeRotation % 360) + 360) % 360;
    let delta = requiredMod - currentMod;
    if(delta <= 0) delta += 360;
    const extraSpins = 13 + Math.floor(Math.random()*4);
    const thisSpinDegrees = delta + extraSpins*360;
    cumulativeRotation += thisSpinDegrees;
    canvas.style.transform = `rotate(${cumulativeRotation}deg)`;
    scheduleTicks(SPIN_MS, thisSpinDegrees/segAngle);

    const onEnd = (e)=>{
      if(e.propertyName !== 'transform') return;
      canvas.removeEventListener('transitionend', onEnd);
      spinning = false;
      spinBtn.disabled = false;
      spinBtnLabel.textContent = 'SPIN';

      const agent = agents[idx];
      const rc = roleColor(agent.role);
      resultEyebrow.textContent = currentPlayer + ' locks in';
      resultAgentName.textContent = agent.name;
      resultRole.textContent = agent.role || '\u00A0';
      resultCard.style.borderLeftColor = rc.base;
      resultIcon.innerHTML = '';
      if(agent.icon){
        const img = document.createElement('img');
        img.src = agent.icon;
        img.alt = agent.name;
        resultIcon.appendChild(img);
      } else {
        resultIcon.textContent = agent.name.charAt(0);
      }

      wheelStage.classList.add('lock');
      setTimeout(()=>wheelStage.classList.remove('lock'), 550);
      resultCard.classList.add('reveal');
      burstConfetti([rc.base, rc.alt, '#FFCB57', '#ffffff']);
      playReveal();

      history.push({player:currentPlayer, agent:agent.name, role:agent.role});
      renderHistory();
    };
    canvas.addEventListener('transitionend', onEnd);
  }

  spinBtn.addEventListener('click', spinWheel);
  window.addEventListener('resize', ()=>{ if(!spinning) setCanvasSize(); });

  renderHistory();
  init();
})();
</script>
</body>
</html>
